<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Seite nicht gefunden | M2 Cybersec</title>
    <link rel="icon" type="image/x-icon" href="/assets/logo.png">

    <link rel="preload" href="/assets/fonts/nekst-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/helvetica-now-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/css/base.css">
    <style>

        body {
            background: var(--primary-dark);
            color: var(--primary-white);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 5%;
        }

        .error-code {
            font-family: var(--font-display);
            font-size: 8rem;
            font-weight: 500;
            color: var(--primary-cyan);
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -4px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-white);
            margin-bottom: 1rem;
        }

        p {
            color: var(--secondary-light-gray);
            font-size: 1.05rem;
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            position: absolute;
            top: 1.5rem;
            left: 5%;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-cyan);
            text-decoration: none;
        }

        .logo .logo-image { height: 36px; }

        @media (max-width: 480px) {
            .error-code { font-size: 5rem; }
            h1 { font-size: 1.4rem; }
            .buttons { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <a href="/" class="logo">
        <img src="/assets/logo.png" alt="M2 Cybersec Logo" class="logo-image" width="49" height="36">
        <span>M2 Cybersec</span>
    </a>

    <main>
        <div class="error-code">404</div>
        <h1>Diese Seite wurde nicht gefunden</h1>
        <p>Die gesuchte Seite existiert nicht oder wurde verschoben. Kein Grund zur Panik – wir helfen Ihnen weiter.</p>

        <div class="buttons btn-row">
            <a href="/" class="btn btn-primary">Zur Startseite →</a>
            <a href="/#contact" class="btn btn-secondary">Kontakt aufnehmen</a>
        </div>
    </main>
</body>
</html>
